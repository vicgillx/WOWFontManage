[package]
name = "wow-font-manager"
version = "0.1.0"
description = "Cross-platform World of Warcraft font manager"
authors = ["WOWFontManage"]
edition = "2021"

[lib]
name = "wow_font_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
time = { version = "0.3", features = ["formatting", "local-offset"] }
